[toolchain]
anchor_version = "0.31.1"

[features]
resolution = true
skip-lint = false

# NOTE: "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS" is a placeholder.
# After the first `anchor build`, run `anchor keys sync` and replace the id
# everywhere with the real program keypair pubkey (target/deploy/splitpay-keypair.json).
[programs.localnet]
splitpay = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
splitpay = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
