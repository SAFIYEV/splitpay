[package]
name = "splitpay"
version = "0.1.0"
description = "SplitPay - group expense splitting with USDC settlements on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "splitpay"

[features]
default = []
# Restricts complete_settlement to the real USDC mints (mainnet + devnet).
# OFF by default so localnet tests can use a freely-mintable test mint.
# ALWAYS build deploy artifacts with `--features usdc-allowlist`
# (the CI devnet deploy does this); never deploy a default build.
usdc-allowlist = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
