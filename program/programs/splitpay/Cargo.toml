[package]
name = "splitpay"
version = "0.1.0"
description = "SplitPay - group expense splitting with USDC settlements on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "splitpay"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
