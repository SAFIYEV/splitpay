# Сборка, тест и деплой Solana-программы SplitPay.
# Локальная сборка на Windows невозможна (Anchor/Solana toolchain — только Linux),
# поэтому программа собирается здесь, в CI.
#
# Деплой в devnet: запускается вручную (workflow_dispatch) и требует секрет
#   SOLANA_DEPLOYER_KEYPAIR — base58 приватного ключа деплоера (solana-keygen new)
name: solana-program

on:
  push:
    paths: ['program/**', '.github/workflows/solana-program.yml']
  workflow_dispatch:
    inputs:
      deploy_devnet:
        description: 'Задеплоить в devnet после сборки'
        type: boolean
        default: false

defaults:
  run:
    working-directory: program

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache toolchain artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.avm
            ~/.local/share/solana
            program/target
          key: ${{ runner.os }}-solana-2.1.21-anchor-0.31.1-${{ hashFiles('program/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-solana-2.1.21-anchor-0.31.1-

      - name: Install Solana CLI (Agave 2.1.21)
        # Прямая загрузка релизного tarball (включает solana-test-validator и
        # cargo-build-sbf). Раскладка повторяет официальный инсталлер, чтобы
        # работало кэширование; сам инсталлер-скрипт не используем — он падал
        # с exit 127 в non-TTY окружении раннера.
        run: |
          mkdir -p "$HOME/.local/share/solana/install"
          curl -sSfLo /tmp/solana.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/v2.1.21/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar -xjf /tmp/solana.tar.bz2 -C "$HOME/.local/share/solana/install"
          ln -sfn "$HOME/.local/share/solana/install/solana-release" "$HOME/.local/share/solana/install/active_release"
          # GITHUB_PATH действует только на ПОСЛЕДУЮЩИЕ шаги — в этом шаге
          # PATH экспортируем вручную.
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          solana --version

      - name: Install Anchor CLI 0.31.1 (avm)
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          export PATH="$HOME/.cargo/bin:$HOME/.avm/bin:$PATH"
          avm install 0.31.1
          avm use 0.31.1
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          anchor --version

      - name: Install test dependencies
        run: |
          npm install -g yarn
          yarn install

      - name: Build program
        run: anchor build

      - name: Sync program keys
        run: anchor keys sync

      - name: Run tests (local validator)
        # Тесты намеренно идут без фичи usdc-allowlist: на локальном
        # валидаторе используется свободно-минтимый тестовый минт.
        run: anchor test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splitpay-program
          path: |
            program/target/deploy/*.so
            program/target/idl/*.json
            program/target/types/*.ts

      - name: Build hardened program for deploy
        # Деплой-сборка ОБЯЗАТЕЛЬНО с usdc-allowlist: ограничивает
        # complete_settlement реальными USDC-минтами (mainnet + devnet).
        # --manifest-path обязателен: корень — виртуальный workspace,
        # cargo не принимает --features на его уровне.
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_devnet
        run: cargo build-sbf --manifest-path programs/splitpay/Cargo.toml --features usdc-allowlist

      - name: Deploy to devnet
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_devnet
        env:
          SOLANA_DEPLOYER_KEYPAIR: ${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}
        run: |
          solana config set --url devnet
          solana-keygen recover prompt:// <<< "$SOLANA_DEPLOYER_KEYPAIR" --outfile ~/.config/solana/id.json --force
          solana airdrop 2 || true
          anchor deploy --provider.cluster devnet
          echo "Program ID:" && solana address
        # После деплоя: Program ID внести в env инстанса
        # (SPLITPAY_PROGRAM_ID и VITE_SPLITPAY_PROGRAM_ID) — см. docs/DEPLOY.md
